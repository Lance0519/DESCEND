[project]
name = "descend-api"
version = "1.0.0"
description = "DESCEND Flask API"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.0",
  "Flask-Cors==5.0.0",
  "Flask-SQLAlchemy==3.1.1",
  "networkx==3.4.2",
  "pymysql==1.1.1",
  "psycopg2-binary==2.9.10",
  "python-dotenv==1.0.1",
  "scikit-learn==1.5.2",
  "joblib==1.4.2",
  "PyJWT==2.9.0",
]

[tool.vercel]
entrypoint = "index:app"
